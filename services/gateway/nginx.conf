# API gateway (DEV-43): single public entry on :8000 (host) -> path-routed to
# services over the compose network. Mounted at /etc/nginx/conf.d/default.conf.
#
# resolver + variable proxy_pass = runtime DNS: nginx must boot (and keep
# serving the routes that DO exist) while some services aren't deployed yet —
# with static upstreams it refuses to start on the first unresolvable name.
# 127.0.0.11 is Docker's embedded DNS.
#
# Deliberately unrouted: /internal/* (east-west), /events/* + /dapr/* (sidecar
# surface) — those 404 publicly.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Exact matches win over prefix matches regardless of order — these two
    # carve the submission-history routes out of /api/auth/ (history-service
    # owns submissions; auth-service owns identity).
    location = /api/auth/my-submissions { set $u http://history:8000;       proxy_pass $u; }
    location = /api/auth/claim-sessions { set $u http://history:8000;       proxy_pass $u; }
    location /api/auth/                 { set $u http://auth:8000;          proxy_pass $u; }
    # Exact match: the router mounts /api/profile with no trailing slash.
    location = /api/profile             { set $u http://auth:8000;          proxy_pass $u; }
    location /api/roadmap/              { set $u http://roadmap:8000;       proxy_pass $u; }
    location = /api/questions           { set $u http://questionnaire:8000; proxy_pass $u; }
    location /api/questionnaire/        { set $u http://questionnaire:8000; proxy_pass $u; }
    location = /api/health              { set $u http://matching:8000;      proxy_pass $u; }
}
