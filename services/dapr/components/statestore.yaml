apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis:6379"
    - name: redisPassword
      value: ""
    # No app-id prefix: history/roadmap/questionnaire app-ids all touch the
    # same sub:/idx:/progress: keys (and DEV-38 monolith data stays readable).
    - name: keyPrefix
      value: "none"
